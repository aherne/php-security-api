<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title description">
  <title id="title">Lucinda Security: public API contract</title>
  <desc id="description">The host application supplies XML configuration, a normalized request, and optional integrations. Wrapper processes security and returns Packet or null for application-owned handling. Numbered references are explained in the README.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; }
      .heading { font-size: 26px; font-weight: 700; text-anchor: start; }
      .sub { font-size: 15px; fill: #475569; text-anchor: start; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .core { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .label { font-size: 19px; font-weight: 700; }
      .detail { font-size: 14px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .number { fill: #0369a1; }
      .index { fill: #fff; font-size: 14px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1000" height="490" rx="16" fill="#f8fafc"/>
  <text x="40" y="49" class="heading">You own the application. Wrapper coordinates security.</text>
  <text x="40" y="77" class="sub">Inputs above · processing in the center · response decisions remain with the caller</text>
  <g id="configuration">
    <rect x="40" y="110" width="280" height="90" rx="12" class="box"/>
    <text x="180" y="148" class="label">XML configuration</text>
    <text x="180" y="175" class="detail">Mechanisms and implementation classes</text>
  </g>
  <g id="request">
    <rect x="360" y="110" width="280" height="90" rx="12" class="box"/>
    <text x="500" y="148" class="label">Request</text>
    <text x="500" y="175" class="detail">Normalized HTTP input</text>
  </g>
  <g id="integrations">
    <rect x="680" y="110" width="280" height="90" rx="12" class="box" stroke-dasharray="6 5"/>
    <text x="820" y="145" class="label">Optional integrations</text>
    <text x="820" y="171" class="detail">OAuth2 services / state · route roles</text>
  </g>
  <path d="M180 200V240H430V280" class="edge"/>
  <path d="M500 200V280" class="edge"/>
  <path d="M820 200V240H570V280" class="edge" stroke-dasharray="6 5"/>
  <circle cx="300" cy="240" r="13" class="number"/><text x="300" y="245" class="index">1</text>
  <circle cx="500" cy="232" r="13" class="number"/><text x="500" y="237" class="index">2</text>
  <circle cx="700" cy="240" r="13" class="number"/><text x="700" y="245" class="index">3</text>
  <g id="host-application">
    <rect x="40" y="295" width="280" height="95" rx="12" class="box"/>
    <text x="180" y="331" class="label">Host application</text>
    <text x="180" y="358" class="detail">Creates inputs and calls Wrapper</text>
  </g>
  <path d="M320 342H360" class="edge"/>
  <g id="wrapper">
    <rect x="360" y="280" width="280" height="125" rx="12" class="core"/>
    <circle cx="384" cy="304" r="13" class="number"/><text x="384" y="309" class="index">4</text>
    <text x="500" y="329" class="label">Wrapper</text>
    <text x="500" y="357" class="detail">Restore identity · evaluate security</text>
    <text x="500" y="382" class="detail">getOutcome()</text>
  </g>
  <path d="M640 342H680" class="edge"/>
  <circle cx="660" cy="342" r="13" class="number"/><text x="660" y="347" class="index">5</text>
  <g id="outcome">
    <rect x="680" y="295" width="280" height="95" rx="12" class="box"/>
    <text x="820" y="331" class="label">Packet | null</text>
    <text x="820" y="358" class="detail">Application renders, redirects, or continues</text>
  </g>
  <text x="500" y="454" class="detail">Unexpected failures can throw. Expected security rejections are packets.</text>
</svg>
