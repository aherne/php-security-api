<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title description">
  <title id="title">OAuth2 redirect and callback lifecycle</title>
  <desc id="description">The first request saves provider-bound state and returns an authorization redirect. A subsequent callback consumes valid state before code exchange and user-info lookup. A DAO resolves or provisions an eligible local account before MFA staging.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; }
      .heading { font-size: 26px; font-weight: 700; text-anchor: start; }
      .sub { font-size: 15px; fill: #475569; text-anchor: start; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .core { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .label { font-size: 18px; font-weight: 700; }
      .detail { font-size: 14px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .number { fill: #0369a1; }
      .index { fill: #fff; font-size: 14px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1000" height="700" rx="16" fill="#f8fafc"/>
  <text x="40" y="49" class="heading">One login spans two requests and a provider round-trip.</text>
  <text x="40" y="77" class="sub">OAuth2 state is one-time, provider-bound input—not an authenticated identity.</text>
  <rect x="40" y="130" width="260" height="90" rx="12" class="box"/>
  <text x="170" y="167" class="label">Initial login request</text><text x="170" y="194" class="detail">Configured provider route</text>
  <path d="M300 175H370" class="edge"/>
  <rect x="370" y="130" width="260" height="90" rx="12" class="core"/>
  <text x="500" y="167" class="label">Generate + save state</text><text x="500" y="194" class="detail">Provider and expiration bound</text>
  <circle cx="394" cy="154" r="13" class="number"/><text x="394" y="159" class="index">1</text>
  <path d="M630 175H700" class="edge"/>
  <rect x="700" y="130" width="260" height="90" rx="12" class="box"/>
  <text x="830" y="167" class="label">DEFERRED packet</text><text x="830" y="194" class="detail">Provider authorization URL</text>
  <path d="M830 220V295H170V355" class="edge" stroke-dasharray="6 5"/>
  <text x="500" y="277" class="detail">Application redirects → provider round-trip → new callback request</text>
  <rect x="40" y="355" width="260" height="90" rx="12" class="box"/>
  <text x="170" y="392" class="label">Provider callback</text><text x="170" y="419" class="detail">state + code / error</text>
  <path d="M300 400H370" class="edge"/>
  <rect x="370" y="355" width="260" height="90" rx="12" class="core"/>
  <text x="500" y="392" class="label">Consume valid state</text><text x="500" y="419" class="detail">Before provider calls</text>
  <circle cx="394" cy="379" r="13" class="number"/><text x="394" y="384" class="index">2</text>
  <path d="M630 400H700" class="edge"/>
  <rect x="700" y="355" width="260" height="90" rx="12" class="box"/>
  <text x="830" y="392" class="label">OAuth2Service</text><text x="830" y="419" class="detail">Code exchange + user information</text>
  <circle cx="724" cy="379" r="13" class="number"/><text x="724" y="384" class="index">3</text>
  <path d="M830 445V490H500V535" class="edge"/>
  <rect x="370" y="535" width="260" height="90" rx="12" class="core"/>
  <text x="500" y="572" class="label">Local account DAO</text><text x="500" y="599" class="detail">Resolve → configured provisioning</text>
  <circle cx="394" cy="559" r="13" class="number"/><text x="394" y="564" class="index">4</text>
  <path d="M630 580H700" class="edge"/>
  <rect x="700" y="535" width="260" height="90" rx="12" class="box"/>
  <text x="830" y="572" class="label">Identity or decision</text><text x="830" y="599" class="detail">MFA staging / pending / failure</text>
  <text x="190" y="565" class="detail">Invalid state, provider errors,</text><text x="190" y="591" class="detail">and policy rejections return failure.</text>
  <text x="500" y="672" class="detail">Account approval pending is not pending MFA. Provider access tokens are not library authentication tokens.</text>
</svg>
