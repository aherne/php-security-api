<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title description">
  <title id="title">Shared form-login and MFA throttling pattern</title>
  <desc id="description">An already-blocked attempt returns throttling immediately. Otherwise verification proceeds. A rejected credential or code is penalized, then throttling is reevaluated: the same attempt can now be blocked. Ordinary failure is returned when it remains unblocked.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; }
      .heading { font-size: 26px; font-weight: 700; text-anchor: start; }
      .sub { font-size: 15px; fill: #475569; text-anchor: start; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .core { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .label { font-size: 19px; font-weight: 700; }
      .detail { font-size: 14px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .number { fill: #0369a1; }
      .index { fill: #fff; font-size: 14px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1000" height="700" rx="16" fill="#f8fafc"/>
  <text x="40" y="49" class="heading">The second check observes the newly recorded penalty.</text>
  <text x="40" y="77" class="sub">Same pattern, separate XML-selected interfaces: username/IP for form login, user ID/IP for MFA.</text>
  <rect x="100" y="125" width="410" height="70" rx="12" class="box"/>
  <text x="305" y="167" class="label">Already throttled?</text>
  <circle cx="124" cy="149" r="13" class="number"/><text x="124" y="154" class="index">1</text>
  <path d="M305 195V250" class="edge"/><text x="335" y="226" class="detail">no</text>
  <rect x="100" y="250" width="410" height="70" rx="12" class="box"/>
  <text x="305" y="292" class="label">Verify credentials / TOTP</text>
  <circle cx="124" cy="274" r="13" class="number"/><text x="124" y="279" class="index">2</text>
  <path d="M305 320V375" class="edge"/><text x="350" y="351" class="detail">rejected</text>
  <rect x="100" y="375" width="410" height="70" rx="12" class="box"/>
  <text x="305" y="417" class="label">penalize(identity, IP)</text>
  <circle cx="124" cy="399" r="13" class="number"/><text x="124" y="404" class="index">3</text>
  <path d="M305 445V500" class="edge"/>
  <rect x="100" y="500" width="410" height="70" rx="12" class="core"/>
  <text x="305" y="542" class="label">Throttled after penalty?</text>
  <circle cx="124" cy="524" r="13" class="number"/><text x="124" y="529" class="index">4</text>
  <path d="M510 160H790V375" class="edge"/><text x="590" y="145" class="detail">yes</text>
  <path d="M510 535H790V445" class="edge"/><text x="590" y="519" class="detail">yes</text>
  <rect x="650" y="375" width="280" height="70" rx="12" class="core"/>
  <text x="790" y="417" class="label">Throttling packet</text>
  <path d="M510 285H650" class="edge"/><text x="579" y="269" class="detail">accepted</text>
  <rect x="650" y="250" width="280" height="70" rx="12" class="box"/><text x="790" y="292" class="label">Normal success path</text>
  <path d="M305 570V610H650" class="edge"/><text x="340" y="598" class="detail">no</text>
  <rect x="650" y="575" width="280" height="70" rx="12" class="box"/><text x="790" y="617" class="label">Ordinary failure packet</text>
  <text x="500" y="677" class="detail">Thresholds, counters, windows, and cooldowns remain DAO policy; no time penalty is exposed publicly.</text>
</svg>
